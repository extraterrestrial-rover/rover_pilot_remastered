; Arm firmware: one master ESP32 (USB serial to the PC, I2C bus master) and four slave ESP32s (one motor each), all
; DOIT ESP32 DevKit V1. See ../README_ARM.md.
;
;   pio run -e master -t upload             the master (USB to the arm computer)
;   pio run -e slave_shoulder -t upload     one environment per slave: the joint and its I2C address are built in
;   pio run -e slave_elbow -t upload
;   pio run -e slave_wrist_a -t upload      bevel-gear wrist, motor A
;   pio run -e slave_wrist_b -t upload      bevel-gear wrist, motor B
;   pio test -e native                      unit tests of lib/arm_core on this computer

[platformio]
default_envs = master

[esp32]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; CORE_DEBUG_LEVEL=0 keeps ESP-IDF log text off UART0: only protocol packets may travel on the master's serial line.
build_flags = -DCORE_DEBUG_LEVEL=0 -Wall -Wextra
test_ignore = test_native

[env:master]
extends = esp32
build_src_filter = +<master/>

[env:slave_shoulder]
extends = esp32
build_src_filter = +<slave/>
build_flags = ${esp32.build_flags} -DSLAVE_JOINT=0

[env:slave_elbow]
extends = esp32
build_src_filter = +<slave/>
build_flags = ${esp32.build_flags} -DSLAVE_JOINT=1

[env:slave_wrist_a]
extends = esp32
build_src_filter = +<slave/>
build_flags = ${esp32.build_flags} -DSLAVE_JOINT=2

[env:slave_wrist_b]
extends = esp32
build_src_filter = +<slave/>
build_flags = ${esp32.build_flags} -DSLAVE_JOINT=3

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror
