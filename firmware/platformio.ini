; Rover drive firmware (single ESP32, 4 motor drivers), Ethernet edition: the onboard PC link is a W5500 (../LINK.md).
; Needs Arduino-ESP32 core 3.x (pioarduino): core 2.x has no SPI Ethernet. See ../README.md.
;
;   pio run -e esp32doit-devkit-v1 -t upload     build and flash
;   pio test -e native                            unit tests of lib/drive_core on this computer

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
; Pinned, so every computer builds the same firmware: pioarduino 55.03.311 is Arduino-ESP32 core 3.3.11. A bare
; `espressif32` installs whatever the PlatformIO registry has (core 2.x), which has no SPI Ethernet: this branch
; then fails to build (src/net_link.cpp stops with an #error).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; CORE_DEBUG_LEVEL=0 keeps ESP-IDF log text off UART0 (USB carries only a few lines of bring-up text on this branch).
build_flags = -DCORE_DEBUG_LEVEL=0 -Wall -Wextra
test_ignore = test_native

; Profiling build: the same firmware plus CPU-load, loop-time, heap and stack measurement, reported once a second for
; tools/profile.py (README, "Measuring CPU and memory"). Flash esp32doit-devkit-v1 back afterwards.
;   pio run -e profile -t upload
[env:profile]
extends = env:esp32doit-devkit-v1
build_flags = ${env:esp32doit-devkit-v1.build_flags} -DDRIVE_PROFILE=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror
