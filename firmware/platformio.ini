; Rover drive firmware (single ESP32, 4 motor drivers). See ../README.md.
;
;   pio run -e esp32doit-devkit-v1 -t upload     build and flash
;   pio test -e native                            unit tests of lib/drive_core on this computer

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; CORE_DEBUG_LEVEL=0 keeps ESP-IDF log text off UART0: only protocol packets may travel on the serial line.
build_flags = -DCORE_DEBUG_LEVEL=0 -Wall -Wextra
test_ignore = test_native

; Profiling build: the same firmware plus CPU-load, loop-time, heap and stack measurement, reported once a second for
; tools/profile.py (README, "Measuring CPU and memory"). Flash esp32doit-devkit-v1 back afterwards.
;   pio run -e profile -t upload
[env:profile]
extends = env:esp32doit-devkit-v1
build_flags = ${env:esp32doit-devkit-v1.build_flags} -DDRIVE_PROFILE=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror
