# robot_localization, GPS mode only (localization:=gps): the camera's odometry and the GPS -> map -> odom.
# ekf_local (ekf.yaml) keeps odom -> base_footprint smooth, as in the RTAB-Map mode; this filter says how far odom has
# drifted from the GPS and publishes the correction, map -> odom. Its map frame is the rover's start, turned by
# nothing: gps_alignment works out how GPS east-north lies in it (AUTONOMY.md, "GPS").
ekf_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    # The camera's odometry, as motion only (differential): its absolute pose drifts and is what is corrected here.
    odom0: /zed/odom_base
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: true
    odom0_queue_size: 10

    # The GPS, as the rover's position in the map (gps_alignment, only once the heading is known). A fix that is
    # many standard deviations from where the filter has the rover (multipath next to a wall) is not taken.
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_queue_size: 5
    odom1_pose_rejection_threshold: 5.0
