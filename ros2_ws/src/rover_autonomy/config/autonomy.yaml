# Autonomy on the rover laptop (rover_autonomy.launch.py; AUTONOMY.md). Use decimal points for every number.
# The launch file builds Nav2's parameters, the URDF, the EKF's and RTAB-Map's from the /** section; the rover's
# size and the drive geometry come from rover_pilot_remastered's config/drive.yaml and config/wheels/*.yaml.
/**:
  ros__parameters:
    auto_max_speed: 0.5          # m/s: AUTO's top speed (for one run: launch argument max_speed:=0.3)
    auto_max_turn_rate: 0.8      # rad/s: AUTO's top turning rate

    # The rover's outline for the costmaps, centred on base_footprint: the ground point midway between the four
    # wheels. MEASURE: these are placeholders.
    rover_length_m: 1.0          # outer length, front to back, including the wheels
    rover_width_m: 1.0           # outer width, over the wheels
    rover_height_m: 0.8          # highest point (the camera mast); taller obstacles are ignored above this
    inflation_radius_m: 0.7      # Nav2 keeps the rover's centre this far from obstacles where it can
    min_obstacle_height_m: 0.1   # depth points lower than this are ground, not obstacles (rough terrain: raise it)
    obstacle_range_m: 3.0        # the ZED's depth is used up to this distance for the costmaps

    # The ZED 2i's mount: zed_camera_link (the middle of the camera's underside, at the tripod screw) relative to
    # base_footprint. MEASURE: these are placeholders.
    zed_x_m: 0.4                 # forward of the rover's centre
    zed_y_m: 0.0                 # left of the centre line
    zed_z_m: 0.6                 # above the ground
    zed_pitch_rad: 0.0           # tilted down: positive (0.17 = 10 degrees)

    # The ZED wrapper's topics (camera_name zed). CHECK with `ros2 topic list | grep zed_node` (names differ between
    # wrapper versions; 4.x uses rgb/image_rect_color and rgb/camera_info).
    zed_camera_name: zed
    zed_odom_topic: /zed/zed_node/odom
    zed_cloud_topic: /zed/zed_node/point_cloud/cloud_registered
    zed_rgb_topic: /zed/zed_node/rgb/color/rect/image
    zed_rgb_info_topic: /zed/zed_node/rgb/color/rect/camera_info
    zed_depth_topic: /zed/zed_node/depth/depth_registered
    zed_status_topic: /zed/zed_node/pose/status   # its tracking status: AUTO stops when it is lost ('' = not checked)

    map_database: ~/.ros/rover_map.db  # RTAB-Map's map. A fresh run keeps the previous one as rover_map-<time>.db

drive_mux:
  ros__parameters:
    rate_hz: 50.0
    mode_timeout_s: 0.5          # /rover/estop or /rover/auto older than this: the base station is lost
    command_timeout_s: 0.3       # Nav2's command older than this: zeros
    neutral_hold_s: 0.3          # zeros first whenever AUTO starts (the ESP32 re-arms only on a neutral command)
    # The motors' deadband as a wheel target in rpm: `wheel_test.py --percent P` drives P x max_wheel_rpm / 100.
    # MEASURE on the ground (AUTONOMY.md, "Deadband"). 0.0 = not measured yet: no correction, and the rover may not
    # move or turn at Nav2's slow commands. Too high is worse than too low: the rover then drives and turns faster
    # than Nav2 asked. Above 80 % of max_wheel_rpm is refused.
    min_wheel_rpm_straight: 0.0  # the target where the rover just starts to roll straight ahead (expect about 15 to 25)
    min_wheel_rpm_spin: 0.0      # the target where it just starts to turn in place (skid steer needs much more)
    stop_below_rpm: 0.5          # slower commands are noise: a stop
    # AUTO stops itself, and the goal is cancelled, when it cannot know where the rover is:
    odometry_timeout_s: 0.5      # no odometry from the camera for this long
    no_motion_timeout_s: 3.0     # a motion command for this long without the odometry moving (0.0 = not checked)
    no_motion_distance_m: 0.03   # what counts as moving: this far ...
    no_motion_angle_rad: 0.03    # ... or this much turned
    rearm_interval_s: 1.5        # the ESP32 not driving in AUTO (reset, link hiccup): zeros again, at most this often
    # The base station silent while a goal runs: the rover goes on to its goal, then the e-stop is latched until the
    # base station is back. Nothing at the base station can stop the rover on that stretch (the kill switch can).
    goal_timeout_s: 0.5          # /rover/goal_active older than this: no goal is running
    linkless_limit_s: 0.0        # the longest such stretch, in seconds, before the rover stops anyway (0.0 = no limit)

goal_manager:
  ros__parameters:
    link_timeout_s: 0.5          # /rover/auto or /rover/estop older than this: the base station is lost
    rate_hz: 10.0
