# Nav2 (Humble) for the rover. The launch file fills in the values marked "from autonomy.yaml" (speed, turn rate,
# outline, obstacle heights and range, the behaviour tree's path): edit those there.
# Frames: map (RTAB-Map) -> odom (EKF) -> base_footprint. No AMCL or map_server: RTAB-Map provides /map and map->odom.
# Every Nav2 velocity output is remapped by the launch file: controller and behaviours -> cmd_vel_nav ->
# velocity_smoother -> /cmd_vel_auto -> drive_mux. Nav2 never publishes /cmd_vel.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: ''  # from the launch file: behavior_trees/navigate_to_pose.xml (no backing up)
    default_nav_through_poses_bt_xml: ''  # from the launch file: behavior_trees/navigate_through_poses.xml
    # Nav2 Humble's default list: every node these trees and Humble's default trees use.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.26   # from autonomy.yaml (goal_heading_tolerance_deg; 3.15 without turn_to_goal_heading)
    # auto_driving: arcs (autonomy.yaml). Regulated Pure Pursuit steers towards a point about a metre ahead on the
    # path, so the rover rolls through curves instead of stopping to turn on the spot. It turns on the spot only when
    # the path starts behind the rover (pivot_above_deg) and, at the goal, to the arrow clicked in RViz.
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.5    # from autonomy.yaml
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.5
      lookahead_time: 1.8
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true  # slower in tight curves ...
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_cost_regulated_linear_velocity_scaling: true  # ... and close to obstacles
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0  # from the inflation layer's cost_scaling_factor
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 2.0   # from autonomy.yaml (pivot_above_deg)
      rotate_to_heading_angular_vel: 0.8  # from autonomy.yaml (auto_max_turn_rate)
      max_angular_accel: 2.0
      allow_reversing: false     # never reverses: the camera looks forward only
      use_interpolation: true
    # auto_driving: pivot. The controller before arcs (DWB): it turns on the spot whenever the path bends. The launch
    # copies it to FollowPath; it is kept here to go back to without editing this file.
    PivotController:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0             # never reverses: the camera looks forward only
      min_vel_y: 0.0
      max_vel_x: 0.5             # from autonomy.yaml
      max_vel_y: 0.0
      max_vel_theta: 0.8         # from autonomy.yaml
      min_speed_xy: 0.0
      max_speed_xy: 0.5          # from autonomy.yaml
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.3
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      # ObstacleFootprint checks the whole outline along each trajectory; BaseObstacle checks only the cell under the
      # rover's centre, so a corner could clip an obstacle.
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, GoalAlign, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: '[[0.5, 0.5], [0.5, -0.5], [-0.5, -0.5], [-0.5, 0.5]]'  # from autonomy.yaml
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        # A voxel layer: obstacles are kept and cleared in 3D, in cells 10 cm high up to the rover's height. Cleared
        # in 2D, a low obstacle was erased as soon as the camera, close to it, looked over it to the ground behind.
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 10                 # from autonomy.yaml: up to the rover's height, and above the camera
        max_obstacle_height: 1.0     # from autonomy.yaml
        mark_threshold: 0
        unknown_threshold: 15
        publish_voxel_map: false
        # The ZED's cloud comes through obstacles_detection (started by the launch file), which tells ground from
        # obstacles by the direction the surfaces face. A height limit alone turned the ground ahead into a wall of
        # obstacles whenever the rover tilted 3 degrees, or the camera's pitch setting was that far off.
        # obstacles marks, and clears in front of what it sees. ground only clears, down to the ground, so what
        # has gone (a person who walked away) is cleared in open ground too.
        observation_sources: obstacles ground
        obstacles:
          topic: /rover/obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.1   # from autonomy.yaml: what is lower is driven over
          max_obstacle_height: 1.0   # from autonomy.yaml
          obstacle_max_range: 3.0    # from autonomy.yaml
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5    # from autonomy.yaml
          raytrace_min_range: 0.0
          expected_update_rate: 1.5  # s without a cloud: Nav2 waits instead of planning and driving on what it had
        ground:
          topic: /rover/ground
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -1.0  # the ground, wherever a tilt puts it
          max_obstacle_height: 1.0   # from autonomy.yaml
          raytrace_max_range: 3.5    # from autonomy.yaml
          raytrace_min_range: 0.0
          expected_update_rate: 1.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.0        # from autonomy.yaml
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[0.5, 0.5], [0.5, -0.5], [-0.5, -0.5], [-0.5, 0.5]]'  # from autonomy.yaml
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true  # RTAB-Map's /map
      obstacle_layer:
        # A voxel layer: obstacles are kept and cleared in 3D, in cells 10 cm high up to the rover's height. Cleared
        # in 2D, a low obstacle was erased as soon as the camera, close to it, looked over it to the ground behind.
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 10                 # from autonomy.yaml: up to the rover's height, and above the camera
        max_obstacle_height: 1.0     # from autonomy.yaml
        mark_threshold: 0
        unknown_threshold: 15
        publish_voxel_map: false
        # The ZED's cloud comes through obstacles_detection (started by the launch file), which tells ground from
        # obstacles by the direction the surfaces face. A height limit alone turned the ground ahead into a wall of
        # obstacles whenever the rover tilted 3 degrees, or the camera's pitch setting was that far off.
        # obstacles marks, and clears in front of what it sees. ground only clears, down to the ground, so what
        # has gone (a person who walked away) is cleared in open ground too.
        observation_sources: obstacles ground
        obstacles:
          topic: /rover/obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.1   # from autonomy.yaml: what is lower is driven over
          max_obstacle_height: 1.0   # from autonomy.yaml
          obstacle_max_range: 3.0    # from autonomy.yaml
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5    # from autonomy.yaml
          raytrace_min_range: 0.0
          expected_update_rate: 1.5  # s without a cloud: Nav2 waits instead of planning and driving on what it had
        ground:
          topic: /rover/ground
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -1.0  # the ground, wherever a tilt puts it
          max_obstacle_height: 1.0   # from autonomy.yaml
          raytrace_max_range: 3.5    # from autonomy.yaml
          raytrace_min_range: 0.0
          expected_update_rate: 1.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.0        # from autonomy.yaml
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true            # plan through what the map has not seen yet

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, wait]  # no backing up: nothing watches behind the rover
    spin:
      plugin: nav2_behaviors/Spin
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8          # from autonomy.yaml
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true           # limit a change of speed and of turning together, so an arc keeps its shape
    feedback: OPEN_LOOP
    max_velocity: [0.5, 0.0, 0.8]    # from autonomy.yaml
    min_velocity: [0.0, 0.0, -0.8]   # from autonomy.yaml
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]  # drive_mux corrects for the motors' deadband instead
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 4.0
    node_names: [controller_server, planner_server, behavior_server, bt_navigator, velocity_smoother]
